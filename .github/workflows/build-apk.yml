name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'Perawatan_Motor_Driver_Baru.zip'
      - 'Perawatan_Motor_Driver_Update.zip'
      - 'PerawatanMotor.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract project ZIP
        run: |
          if [ -f Perawatan_Motor_Driver_Baru.zip ]; then
            ZIP_FILE="Perawatan_Motor_Driver_Baru.zip"
          elif [ -f Perawatan_Motor_Driver_Update.zip ]; then
            ZIP_FILE="Perawatan_Motor_Driver_Update.zip"
          else
            ZIP_FILE="PerawatanMotor.zip"
          fi
          unzip -o "$ZIP_FILE" -d extracted
          PUBSPEC_PATH=$(find extracted -name pubspec.yaml -print -quit)
          if [ -z "$PUBSPEC_PATH" ]; then
            echo "pubspec.yaml tidak ditemukan di dalam ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Check Flutter project
        run: |
          test -f "$PROJECT_DIR/pubspec.yaml"
          test -f "$PROJECT_DIR/lib/main.dart"

      - name: Setup Android platform
        run: |
          cd "$PROJECT_DIR"
          if [ ! -d android ]; then
            flutter create . --platforms=android
          fi

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Build release APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Perawatan-Motor-Driver-APK
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
